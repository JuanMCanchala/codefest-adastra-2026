name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # El core verificable (metricas, chunking, schema, fusion, limpieza, indice
      # disperso y recuperador por grafo) no necesita torch, faiss ni los modelos:
      # basta numpy, networkx, pysbd y pyyaml. CI liviano y rapido.
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml numpy networkx pysbd

      - name: Run test suite
        run: python -m pytest -q
