# Config de prueba GPU con el encoder ganador (BGE-M3) sobre el corpus proxy.
# Un solo encoder, sin rerank ni grafo: aisla el efecto de BGE-M3 vs MiniLM.

seed: 42

paths:
  corpus_raw: "data/proxy"
  processed: "data/processed"
  entrega: "entrega_bge"
  queries: "eval_interno/queries_smoke.jsonl"
  resultados: "entrega_bge/resultados.jsonl"

extraction:
  pdf_backend: "pymupdf"
  ocr_enabled: false
  ocr_langs: ["es", "en", "pt"]

cleaning:
  fix_encoding: true
  detect_language: false
  drop_boilerplate: false
  min_chunk_chars: 20

chunking:
  strategy: "sentence_window"
  index_max_tokens: 80
  overlap_sentences: 1
  output_max_words: 250
  respect_sentences: true

encoders:
  - name: "bge-m3"
    model_id: "BAAI/bge-m3"
    weight: 1.0
    normalize: true
    use_dense: true
    use_sparse: false
    use_colbert: false

faiss:
  index_type: "IndexFlatIP"

retrieval:
  top_k_faiss: 20
  fusion: "rrf"
  rrf_k: 60
  final_fragments: 10
  final_documents: 3

rerank:
  enabled: false
  model_id: "BAAI/bge-reranker-v2-m3"
  top_k_candidates: 20

aggregation:
  method: "max_pool"
  k_chunks: 20

graph:
  enabled: false
  ner_model: "urchade/gliner_multi-v2.1"
  entity_types: ["persona", "organizacion", "pais", "tecnologia", "evento", "lugar"]
  fuse_into_retrieval: false
